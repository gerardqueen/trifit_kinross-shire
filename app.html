<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0d">
<title>TRI FIT members</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="head">
  <div class="wrap head-in">
    <a class="brand" href="./"><img src="img/logo.png" alt="" width="46" height="46"><span>TRI FIT<small>Members</small></span></a>
    <div class="formrow">
      <a class="btn ghost sm" id="site-link" href="admin.html" hidden>Website content</a>
      <button class="btn ghost sm" type="button" id="signout" hidden>Sign out</button>
    </div>
  </div>
</header>

<main class="wrap admin">
  <div id="login-view" hidden>
    <form class="panel login" id="login-form" novalidate>
      <h2 id="l-title">Member login</h2>
      <p class="hint" id="l-intro">For TRI FIT members, coaches and admins.</p>
      <div class="field" id="l-name-field" hidden><label for="l-name">Your name</label><input id="l-name" autocomplete="name" maxlength="80"></div>
      <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field" id="l-pass-field">
        <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required minlength="8">
        <button type="button" class="linkish" id="l-forgot" style="justify-self:end">Forgot password?</button>
      </div>
      <p class="hint" id="l-hint" hidden>Use the email you use for TeamUp. At least 8 characters for the password. You will get an email to confirm the address.</p>
      <button class="btn" type="submit" id="l-submit">Sign in</button>
      <button type="button" class="linkish" id="l-toggle">New here? Create an account</button>
      <p class="error" id="l-error" hidden role="alert"></p>
      <p class="success" id="l-ok" hidden role="status"></p>
    </form>
  </div>

  <div id="reset-view" hidden>
    <form class="panel login" id="reset-form" novalidate>
      <h2>Set a new password</h2>
      <p class="hint">Signed in as <strong id="r-email"></strong>.</p>
      <div class="field"><label for="r-pass">New password</label><input id="r-pass" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="r-pass2">Confirm new password</label><input id="r-pass2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn" type="submit" id="r-submit">Save new password</button>
      <p class="error" id="r-error" hidden role="alert"></p>
    </form>
  </div>

  <div id="wait-view" hidden>
    <div class="panel login">
      <h2 id="wt-title">Nearly there</h2>
      <p id="wt-text"></p>
      <div class="formrow"><button class="btn" type="button" id="wt-check" hidden>Check my TeamUp membership</button><button class="btn ghost" type="button" id="wt-signout">Sign out</button></div>
      <p class="hint" id="wt-msg" hidden></p>
    </div>
  </div>

  <div id="app-view" hidden>
    <p class="banner" id="demo-banner" hidden></p>
    <p class="success" id="flash" hidden role="status" style="margin-bottom:14px"></p>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
      <h2 id="hello">Training</h2><span class="who" id="who"></span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="pane"></div>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
